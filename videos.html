<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Videos – SV Holtsee/Wittensee</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/videos.css">

    <script src="js/autoreturn.js" defer></script>
    <script src="js/videos.js" defer></script>
</head>

<body>

    <!-- Hintergrundabdunklung -->
    <div class="overlay"></div>


    <!-- Zurück -->
    <a class="back-button" href="index.html">
        &#10094; Zurück
    </a>


    <!-- Kopfbereich -->
    <header>

        <img
            class="club-logo"
            src="assets/logo.png"
            alt="SV Holtsee/Wittensee"
        >

        <div>
            <h1>Videos</h1>
            <p>SV Holtsee/Wittensee</p>
        </div>

    </header>


    <main>

        <!-- VIDEOAUSWAHL -->
        <div class="video-tabs">

            <button
                type="button"
                class="video-tab active"
                data-video="Dateien/Videos/erick.mp4"
            >
                Erick
            </button>

            <button
                type="button"
                class="video-tab active"
                data-video="Dateien/Videos/video1.mp4"
            >
                Parade Ehrick
            </button>


            <button
                type="button"
                class="video-tab"
                data-video="Dateien/Videos/parade.mp4"
            >
                und noch eine
            </button>

        </div>


        <!-- VIDEOPLAYER -->
        <div class="video-container">

            <video
                id="video-player"
                controls
                playsinline
                preload="metadata"
            >
                Dein Browser unterstützt dieses Video nicht.
            </video>

        </div>

    </main>

</body>

</html>
