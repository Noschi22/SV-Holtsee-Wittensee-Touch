<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fotogalerie</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/gallery.css">

    <script src="js/clock.js" defer></script>
    <script src="js/gallery.js" defer></script>
    <script src="js/autoreturn.js" defer></script>
</head>

<body>

    <!-- DATUM & UHR -->
    <div class="datetime-card">

        <div class="date-text" id="date">--</div>

        <div class="clock">
            <span id="clock-main">--:--</span>
            <span id="clock-sec">--</span>
        </div>

    </div>


    <!-- DUNKLER HINTERGRUND -->
    <div class="overlay"></div>


    <!-- ÜBERSCHRIFT -->
    <header>

        <h1>⚽ Fotogalerie ⚽</h1>

        <p>Einfach mal stöbern</p>

    </header>


    <!-- GALERIE / ORDNER BUTTONS -->
    <div class="gallery-tabs" id="gallery-tabs"></div>


    <!-- COVERFLOW -->
    <div class="coverflow-container">

        <!-- LINKS -->
        <button class="nav prev" aria-label="Vorheriges Bild">
            &#10094;
        </button>


        <!-- BILDER WERDEN DURCH JS EINGEFÜGT -->
        <div class="coverflow" id="coverflow"></div>


        <!-- RECHTS -->
        <button class="nav next" aria-label="Nächstes Bild">
            &#10095;
        </button>

    </div>


    <!-- ZURÜCK BUTTON -->
    <a href="welcome.html"
       class="nav-button nav-back-fixed">

        <span>⬅️</span>

        zurück

    </a>


</body>

</html>
