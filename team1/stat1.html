<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Statistik Liga</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/stat.css">

    <script src="../js/clock.js" defer></script>
</head>

<body class="pdf-page1">

    <!-- ZURÜCK -->
    <a href="../team1.html"
       class="nav-button nav-back-fixed">
        <span>⬅️</span>
        zurück
    </a>

    <!-- DATUM UND UHR -->
    <div class="datetime-card">
        <div class="date-text" id="date">--</div>

        <div class="clock">
            <span id="clock-main">--:--</span>
            <span id="clock-sec">--</span>
        </div>
    </div>

    <div class="page-shell">

        <main class="page-content pdf-layout1">

            <h1 class="pdf-title1">Statistik Liga</h1>

            <div class="pdf-footer1">
                <span>aktualisiert am </span>
                <span id="info-date"></span>
            </div>

            <!-- PDF-ANZEIGE -->
            <div class="pdf-container1">

                <iframe
                    id="statistik-pdf"
                    class="stat-pdf"
                    title="Statistik Liga">
                </iframe>

            </div>

        </main>

    </div>

    <script>
        /* Datum der HTML-Aktualisierung anzeigen */
        const lastModified = new Date(document.lastModified);

        const options = {
            weekday: "long",
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        };

        document.getElementById("info-date").textContent =
            lastModified.toLocaleDateString("de-DE", options);

        /*
         * PDF laden.
         * Date.now() verhindert, dass der Raspberry
         * eine alte PDF aus dem Browser-Cache anzeigt.
         */
        const pdfDatei = "../Dateien/statistik-liga.pdf";

        document.getElementById("statistik-pdf").src =
            pdfDatei +
            "?version=" + Date.now() +
            "#toolbar=0&navpanes=0&scrollbar=1&view=FitH";
    </script>

</body>
</html>
